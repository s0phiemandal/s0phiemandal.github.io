<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sophie Mandal - Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --paper:#fdfcfa;
    --ink:#2c2836;
    --ink-soft:#6e6a7c;
    --ink-faint:#a8a4b6;
    --line:#eeecf3;

    --pink:#ffb0da;
    --pink-deep:#ff5fa8;
    --lav:#c6adff;
    --lav-deep:#9857ff;
    --mint:#84eeba;
    --mint-deep:#28d68c;
    --peach:#ffb27e;
    --peach-deep:#ff8534;
    --sky:#82d6ff;
    --sky-deep:#2bb0ff;
    --butter:#ffe14d;
    --butter-deep:#ffc700;

    --accent-a: var(--pink);
    --accent-b: var(--lav);
    --accent-a-deep: var(--pink-deep);
    --accent-b-deep: var(--lav-deep);
    --accent-pale: #fff3fa;

    --radius: 22px;
    --radius-sm: 14px;
    --shadow: 0 10px 30px -12px rgba(44,40,54,0.15);
    --shadow-lg: 0 24px 60px -20px rgba(44,40,54,0.22);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    font-weight:500;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,h4,.display{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}

  ::selection{ background:var(--accent-a); color:var(--ink); }

  /* ---------- Scroll reveal ---------- */
  .reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .reveal{ opacity:1; transform:none; transition:none; }
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 5vw;
    background:rgba(253,252,250,0.82);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Baloo 2'; font-weight:700; font-size:1.15rem; }
  .brand .dot{
    width:14px; height:14px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--pink), var(--lav), var(--sky), var(--mint), var(--butter), var(--peach), var(--pink));
    animation:spin 6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  nav.links{ display:flex; align-items:center; gap:6px; }
  .navlink{
    padding:9px 16px; border-radius:999px; font-weight:700; font-size:0.92rem;
    color:var(--ink-soft); transition:all .25s ease; position:relative;
  }
  .navlink:hover, .navlink.active{ background:var(--paper); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line); }
  .navlink.resume{
    background:var(--ink); color:var(--white);
  }
  .navlink.resume:hover{ background:#443f52; box-shadow:none; transform:translateY(-1px); }

  .dropdown{ position:relative; }
  .dropdown-panel{
    position:absolute; top:calc(100% + 10px); left:50%; transform:translateX(-50%) translateY(-8px);
    background:var(--white); border-radius:16px; box-shadow:var(--shadow-lg);
    padding:8px; width:250px; opacity:0; pointer-events:none; transition:all .22s ease;
    border:1px solid var(--line);
  }
  .dropdown:hover .dropdown-panel, .dropdown:focus-within .dropdown-panel{
    opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0);
  }
  .dropdown-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:10px; font-weight:700; font-size:0.88rem; color:var(--ink);
  }
  .dropdown-item:hover{ background:var(--paper); }
  .dropdown-item .chip{ width:10px; height:10px; border-radius:50%; flex:none; }

  .menu-toggle{ display:none; }

  /* ---------- Hero ---------- */
  .hero{
    position:relative; padding:12vh 6vw 10vh; text-align:center; overflow:hidden;
    min-height:78vh; display:flex; align-items:center; justify-content:center;
  }

  /* ---- interactive hover grid background ---- */
  .grid-wrap{
    position:absolute; inset:0; z-index:0;
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, transparent 20%, white 78%);
    mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, transparent 20%, white 78%);
  }
  .grid-inner{
    position:absolute; left:50%; top:50%;
    transform: translate(-50%,-50%) skewX(-14deg) skewY(6deg) scale(1.35);
    display:flex;
  }
  .grid-row{ display:flex; flex-direction:column; }
  .grid-cell{
    width:34px; height:34px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    flex:none;
  }
  .hero-hint{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%); z-index:2;
    font-size:0.8rem; font-weight:700; color:var(--ink-soft); opacity:0.6;
  }

  .hero-inner{ position:relative; z-index:1; max-width:780px; margin:0 auto; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--white); border:1.5px solid var(--line); border-radius:999px;
    padding:7px 16px; font-weight:800; font-size:0.8rem; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink-soft); box-shadow:var(--shadow); margin-bottom:22px;
  }
  .eyebrow .wave{ animation:wave 1.8s ease-in-out infinite; display:inline-block; transform-origin:70% 70%; }
  @keyframes wave{ 0%,100%{transform:rotate(0);} 20%{transform:rotate(16deg);} 40%{transform:rotate(-10deg);} 60%{transform:rotate(12deg);} 80%{transform:rotate(0);} }

  .hero h1{ font-size:clamp(2.4rem, 6vw, 4.4rem); line-height:1.05; }
  .hero h1 .grad{
    background:linear-gradient(100deg, var(--pink-deep), var(--lav-deep) 45%, var(--sky-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p.sub{
    max-width:560px; margin:22px auto 0; font-size:1.15rem; color:var(--ink-soft); font-weight:700;
  }
  .hero-cta{ margin-top:36px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .btn{
    padding:14px 26px; border-radius:999px; font-weight:800; font-size:0.95rem;
    border:none; display:inline-flex; align-items:center; gap:8px; transition:all .25s cubic-bezier(.2,.8,.3,1.3);
  }
  .btn-primary{
    background:var(--ink); color:var(--white); box-shadow:0 10px 24px -8px rgba(44,40,54,0.4);
  }
  .btn-primary:hover{ transform:translateY(-3px) scale(1.02); box-shadow:0 16px 30px -10px rgba(44,40,54,0.45); }
  .btn-ghost{
    background:var(--white); color:var(--ink); border:2px solid var(--line);
  }
  .btn-ghost:hover{ border-color:var(--ink); transform:translateY(-3px); }

  /* ---------- Section shell ---------- */
  .section{ padding:6vh 6vw; max-width:1180px; margin:0 auto; }
  .section-head{ text-align:center; max-width:640px; margin:0 auto 44px; }
  .section-head .kicker{
    display:inline-block; font-weight:800; font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:10px;
  }
  .section-head h2{ font-size:clamp(1.7rem, 3.4vw, 2.5rem); }
  .section-head p{ color:var(--ink-soft); font-weight:600; margin-top:12px; font-size:1.02rem; }

  /* ---------- Project grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:26px;
  }
  @media(max-width:980px){ .grid{ grid-template-columns:repeat(2,1fr);} }
  @media(max-width:640px){ .grid{ grid-template-columns:1fr;} }

  .card{
    position:relative; border-radius:var(--radius); overflow:hidden; background:var(--white);
    box-shadow:var(--shadow); cursor:pointer; border:1px solid var(--line);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
    aspect-ratio:4/5; display:block;
  }
  .card:hover{ transform:translateY(-8px) rotate(-0.4deg); box-shadow:var(--shadow-lg); }
  .card .cover{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transition:transform .6s ease, filter .4s ease;
  }
  .card:hover .cover{ transform:scale(1.08); }
  .card .tint{
    position:absolute; inset:0; opacity:0.16; mix-blend-mode:multiply; transition:opacity .4s ease;
  }
  .card:hover .tint{ opacity:0.28; }
  .card .label{
    position:absolute; left:16px; top:16px; z-index:2;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(6px);
    padding:6px 13px; border-radius:999px; font-weight:800; font-size:0.72rem;
    letter-spacing:0.02em; box-shadow:var(--shadow);
  }
  .card .overlay{
    position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; justify-content:flex-end;
    padding:22px; background:linear-gradient(180deg, rgba(44,40,54,0) 35%, rgba(30,27,38,0.92) 100%);
    opacity:0; transition:opacity .35s ease;
  }
  .card:hover .overlay{ opacity:1; }
  .card .overlay h3{ color:var(--white); font-size:1.28rem; margin-bottom:8px; transform:translateY(8px); transition:transform .35s ease; }
  .card .overlay p{ color:rgba(255,255,255,0.86); font-size:0.87rem; font-weight:600; margin:0; opacity:0; transform:translateY(8px); transition:all .4s ease .05s; }
  .card:hover .overlay h3, .card:hover .overlay p{ transform:translateY(0); opacity:1; }
  .card .arrow{
    position:absolute; right:22px; bottom:22px; z-index:2; width:38px; height:38px; border-radius:50%;
    background:var(--white); display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(0.6) rotate(-30deg); transition:all .35s cubic-bezier(.2,.8,.3,1.4);
  }
  .card:hover .arrow{ opacity:1; transform:scale(1) rotate(0deg); }

  /* base (static) label under card for touch devices */
  .card-base-label{ display:none; }
  @media (hover:none){
    .card .overlay{ opacity:1; background:linear-gradient(180deg, rgba(44,40,54,0) 50%, rgba(30,27,38,0.88) 100%); }
    .card .overlay h3, .card .overlay p{ opacity:1; transform:none; }
    .card .arrow{ opacity:1; transform:none; }
  }

  /* ---------- About preview ---------- */
  .about-preview{
    display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:center;
    background:var(--white); border-radius:32px; padding:50px; border:1px solid var(--line); box-shadow:var(--shadow);
  }
  @media(max-width:840px){ .about-preview{ grid-template-columns:1fr; padding:30px; } }
  .about-preview img{ border-radius:22px; width:100%; aspect-ratio:1/1.1; object-fit:cover; }
  .pill-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
  .pill{
    padding:7px 14px; border-radius:999px; font-weight:700; font-size:0.82rem; color:var(--ink);
  }

  /* ---------- Footer ---------- */
  footer{
    padding:60px 6vw 40px; text-align:center; border-top:1px solid var(--line); margin-top:40px;
  }
  footer h2{ font-size:clamp(1.6rem,3.5vw,2.4rem); margin-bottom:16px; }
  .social-row{ display:flex; gap:14px; justify-content:center; margin:26px 0; }
  .social-row a{
    width:46px; height:46px; border-radius:50%; background:var(--white); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; transition:all .25s ease; box-shadow:var(--shadow);
  }
  .social-row a:hover{ transform:translateY(-4px) scale(1.08); border-color:transparent; background:var(--accent-a); }
  footer .fine{ color:var(--ink-faint); font-size:0.85rem; margin-top:30px; font-weight:600; }

  /* ================= PROJECT PAGE ================= */
  .proj-page{
    background: linear-gradient(180deg, var(--accent-a) 0%, var(--accent-pale) 26%, var(--white) 46%, var(--white) 60%, var(--accent-pale) 82%, var(--accent-b) 100%);
  }
  .proj-hero{
    position:relative; padding:15vh 6vw 12vh; text-align:center; overflow:hidden;
  }
  .proj-hero::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 82% 8%, var(--accent-b), transparent 55%),
               radial-gradient(circle at 10% 90%, var(--accent-a-deep), transparent 45%);
    opacity:0.55;
  }
  .proj-hero-inner{ position:relative; z-index:2; max-width:760px; margin:0 auto; }
  .back-link{
    display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:0.88rem;
    background:rgba(255,255,255,0.8); backdrop-filter:blur(8px); padding:9px 18px; border-radius:999px;
    margin-bottom:28px; box-shadow:var(--shadow); transition:all .25s ease;
  }
  .back-link:hover{ transform:translateX(-4px); background:var(--white); }
  .proj-tag{
    display:inline-block; background:var(--white); padding:7px 16px; border-radius:999px;
    font-weight:800; font-size:0.78rem; letter-spacing:0.03em; text-transform:uppercase; margin-bottom:20px;
    box-shadow:var(--shadow);
  }
  .proj-hero h1{ font-size:clamp(2.1rem,5vw,3.6rem); line-height:1.08; }
  .proj-hero .proj-sub{ margin-top:16px; font-weight:700; color:var(--ink-soft); font-size:1.1rem; }

  .proj-body{ max-width:880px; margin:0 auto; padding:6vh 6vw 4vh; position:relative; z-index:1; }
  .proj-body p{ font-size:1.06rem; color:#3a3646; margin-bottom:22px; }
  .proj-body h2{
    font-size:1.7rem; margin:56px 0 20px; padding-top:6px; position:relative; display:inline-block;
  }
  .proj-body h2::after{
    content:''; position:absolute; left:0; bottom:-8px; height:11px; width:60%;
    background:var(--accent-a-deep); border-radius:6px; z-index:-1; opacity:0.55;
  }
  .proj-link-box{
    display:flex; align-items:center; gap:14px; background:var(--white); border:1.5px dashed var(--accent-a-deep);
    border-radius:18px; padding:18px 22px; margin:26px 0 8px; font-weight:700; box-shadow:var(--shadow);
  }
  .proj-link-box a{ color:var(--ink); text-decoration:underline; text-decoration-color:var(--accent-a-deep); text-underline-offset:3px; }

  /* ---- immersive section panel ---- */
  .immersive-panel{
    position:relative; border-radius:32px; padding:48px 6vw; margin:0 -6vw 10px;
    overflow:hidden;
  }
  .immersive-panel.tint-a{ background:linear-gradient(150deg, color-mix(in srgb, var(--accent-a) 32%, white), color-mix(in srgb, var(--accent-b) 20%, white)); }
  .immersive-panel .panel-inner{ max-width:880px; margin:0 auto; position:relative; z-index:1; }
  .immersive-panel .deco-blob{
    position:absolute; border-radius:50%; filter:blur(50px); opacity:0.5; z-index:0;
  }

  .gallery{
    display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin:26px 0 10px;
  }
  .gallery.single{ grid-template-columns:1fr; }
  .gallery.three{ grid-template-columns:repeat(3,1fr); }
  @media(max-width:640px){ .gallery, .gallery.three{ grid-template-columns:1fr; } }
  .gallery img{
    border-radius:18px; width:100%; height:100%; object-fit:cover; box-shadow:var(--shadow);
    transition:transform .4s ease, box-shadow .4s ease; cursor:zoom-in;
  }
  .gallery img:hover{ transform:translateY(-6px) scale(1.015); box-shadow:var(--shadow-lg); }

  /* ---- raw image (already has its own device frame baked in, transparent background) ---- */
  .raw-item{
    width:240px; flex:none;
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .raw-item:hover{ transform:translateY(-10px) scale(1.08) !important; z-index:5; }
  .raw-item img{
    width:100%; display:block; cursor:zoom-in;
    filter:drop-shadow(0 18px 30px rgba(44,40,54,0.28));
    transition:filter .4s ease;
  }
  .raw-item:hover img{ filter:drop-shadow(0 26px 40px rgba(44,40,54,0.38)); }

  /* ---- phone frame (Instagram-style mobile shots) ---- */
  .mosaic{ display:flex; flex-wrap:wrap; gap:34px; justify-content:center; align-items:flex-end; margin:34px 0 14px; padding:20px 0; }
  .frame-phone{
    width:220px; background:#1c1a22; border-radius:34px; padding:10px 9px;
    box-shadow:var(--shadow-lg); position:relative; flex:none;
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .frame-phone:hover{ transform:translateY(-10px) scale(1.03) rotate(0deg) !important; }
  .frame-phone::before{
    content:''; position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:56px; height:16px; background:#1c1a22; border-radius:10px; z-index:2;
  }
  .frame-phone .screen{ border-radius:24px; overflow:hidden; background:#fff; aspect-ratio:337/600; }
  .frame-phone .screen img{ width:100%; height:100%; object-fit:cover; cursor:zoom-in; }

  /* ---- browser/slide frame (case study screenshots) ---- */
  .frame-browser{
    width:min(400px, 90vw); border-radius:18px; overflow:hidden; background:var(--white);
    box-shadow:var(--shadow-lg); flex:none; transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .frame-browser:hover{ transform:translateY(-10px) scale(1.02) rotate(0deg) !important; z-index:5; }
  .frame-browser .bar{
    height:32px; background:#f0eef5; display:flex; align-items:center; gap:6px; padding:0 14px;
  }
  .frame-browser .bar span{ width:9px; height:9px; border-radius:50%; }
  .frame-browser img{ width:100%; height:auto; display:block; cursor:zoom-in; }

  /* ---- corkboard pin frame (social graphics) ---- */
  .pin-mosaic{ display:flex; flex-wrap:wrap; gap:26px 22px; justify-content:center; margin:30px 0 10px; padding:10px 0; }
  .frame-pin{
    width:190px; background:var(--white); padding:10px 10px 22px; border-radius:8px;
    box-shadow:var(--shadow-lg); position:relative; flex:none;
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .frame-pin:hover{ transform:translateY(-8px) scale(1.04) rotate(0deg) !important; z-index:5; }
  .frame-pin::before{
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:17px; height:17px; border-radius:50%; background:var(--accent-a-deep);
    box-shadow:0 3px 6px rgba(0,0,0,0.35), inset -2px -2px 3px rgba(0,0,0,0.25);
  }
  .frame-pin img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:3px; cursor:zoom-in; }

  /* ---- floating product card (microwave etc.) ---- */
  .frame-product{
    max-width:520px; margin:34px auto 14px; padding:40px; border-radius:28px; text-align:center;
    background:radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--accent-a) 45%, white), color-mix(in srgb, var(--accent-b) 20%, white));
  }
  .frame-product img{ border-radius:20px; box-shadow:var(--shadow-lg); margin:0 auto; cursor:zoom-in; }

  .proj-cta{
    max-width:820px; margin:60px auto 0; padding:40px; text-align:center; border-radius:26px;
    background:var(--accent-a-deep); position:relative; overflow:hidden; z-index:1;
  }
  .proj-cta h3{ font-size:1.5rem; margin-bottom:10px; color:var(--white); }
  .proj-cta p{ font-weight:700; margin-bottom:22px; color:rgba(255,255,255,0.92); }

  .other-projects{ padding:6vh 6vw 10vh; max-width:1180px; margin:0 auto; position:relative; z-index:1; }

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(20,18,26,0.86); z-index:999;
    display:flex; align-items:center; justify-content:center; padding:5vw;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox img{ max-width:100%; max-height:88vh; border-radius:16px; box-shadow:0 30px 80px rgba(0,0,0,0.5); }
  .lightbox-close{
    position:absolute; top:26px; right:26px; width:46px; height:46px; border-radius:50%;
    background:var(--white); border:none; font-size:1.3rem; font-weight:800;
  }

  /* ================= ABOUT PAGE ================= */
  .about-page{
    background: linear-gradient(180deg, var(--sky) 0%, var(--accent-pale) 18%, var(--white) 34%);
  }
  .about-hero{
    padding:12vh 6vw 6vh; text-align:center; position:relative; overflow:hidden;
    background:var(--paper);
  }
  .about-grid{
    display:grid; grid-template-columns:0.8fr 1.2fr; gap:44px; max-width:1080px; margin:0 auto; padding:4vh 6vw 8vh; align-items:start;
    position:relative; z-index:1;
  }
  @media(max-width:840px){ .about-grid{ grid-template-columns:1fr; } }
  .about-photo{
    border-radius:26px; overflow:hidden; box-shadow:var(--shadow-lg); position:sticky; top:100px;
    transform:rotate(-2deg); border:8px solid var(--white); outline:3px solid var(--pink-deep);
  }
  .confetti{ position:absolute; z-index:0; opacity:0.9; }
  .interest-card{
    border-radius:22px; padding:28px; margin-bottom:20px;
    box-shadow:var(--shadow-lg); transition:transform .3s cubic-bezier(.2,.8,.2,1);
    position:relative; overflow:hidden;
  }
  .interest-card:nth-child(odd){ transform:rotate(-0.6deg); }
  .interest-card:nth-child(even){ transform:rotate(0.6deg); }
  .interest-card:hover{ transform:translateY(-6px) rotate(0deg) scale(1.01); }
  .interest-card h3{ font-size:1.2rem; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
  .interest-card .icon{ font-size:1.5rem; }
  .interest-card p{ margin:0 0 6px; color:#3a3646; font-weight:600; font-size:0.97rem; }
  .interest-card .label{ font-weight:900; color:var(--ink); font-size:0.82rem; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:3px; opacity:0.65;}
  .stat-row{ display:flex; gap:14px; flex-wrap:wrap; margin-top:18px; }
  .stat-chip{
    background:rgba(255,255,255,0.6); border-radius:16px; padding:12px 18px; font-weight:800; font-size:0.85rem;
    display:flex; flex-direction:column; gap:2px;
  }
  .stat-chip b{ font-size:1.3rem; font-family:'Baloo 2'; }

  /* Utility */
  .center{ text-align:center; }
  .page{ animation:fadeIn .45s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  @media(max-width:840px){
    nav.links{ display:none; }
  }
</style>

  {
    slug:"adobe-doordash",
    label:"Case Study",
    title:"Adobe × DoorDash",
    tagLine:"Personal Project",
    hoverDesc:"A solutions-consulting case study on personalization and creative scale for DoorDash.",
    theme:{a:"var(--peach)", b:"var(--butter)", aDeep:"var(--peach-deep)", bDeep:"var(--butter-deep)"},
    tint:"#ffb480",
    cover:"https://static.wixstatic.com/media/9e26ae_88e885f626d24ef99b4a80b736179353~mv2.jpg/v1/fill/w_352,h_344,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/Sophie_Mandal_SolutionsConsultingAnalyst.jpg",
    subhead:"Exploring how Adobe's Creative and Experience Cloud could power DoorDash's next chapter",
    intro:"This project explores how DoorDash could leverage Adobe's Creative and Experience Cloud products to strengthen customer engagement and brand consistency across its growing platform, written from the perspective of a Solutions Consulting Analyst at Adobe. I analyzed DoorDash's current digital ecosystem, identified opportunities in personalization and partner content management, and developed solution recommendations supported by a visual customer journey and campaign examples.",
    intro2:"The project highlights how strategic technology integration can enhance user experience and drive long-term customer loyalty.",
    sections:[
      {
        h:"Where DoorDash Stands Today",
        imgs:["https://static.wixstatic.com/media/9e26ae_1d6253cc80c34b9a96b691a46cce9b7f~mv2.png/v1/fill/w_856,h_481,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/3.png"],
        p:["DoorDash has evolved far beyond being just a food delivery service, it's become a true convenience platform, connecting millions of users not just to restaurants, but also to groceries, alcohol, and retail partners.","What really stands out is that it's positioned against strong competitors like Uber Eats and Instacart by continuing to innovate and diversify, as DashPass has become a major growth driver.","Adobe's solutions aren't about changing what's already working, they're about building on that momentum, enhancing personalization, scaling creative campaigns, and ensuring content consistency across every vertical."]
      },
      {
        h:"Three Key Challenges",
        imgs:["https://static.wixstatic.com/media/9e26ae_b1132330b2954b7a9eca69da23a94d17~mv2.png/v1/fill/w_854,h_480,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/4.png","https://static.wixstatic.com/media/9e26ae_53749143f6ed460db5e75bb46024de71~mv2.png/v1/fill/w_856,h_481,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/5.png"],
        p:["When we look at DoorDash today, three key challenges stand out. First, many promotions are generic and one-size-fits-all, making customers more likely to wait for discounts rather than feel a sense of loyalty.","Second, the quality of restaurant content varies a lot: some menus and photos are polished, but others are inconsistent, which hurts trust and makes the app feel cluttered.","Third, DoorDash manages thousands of partner and brand campaigns at once, which creates creative bottlenecks, so approvals and launches take longer than they should."]
      },
      {
        h:"Three Adobe Solutions",
        imgs:["https://static.wixstatic.com/media/9e26ae_71cce3e9ef2a4de5b3ccf904209d99cb~mv2.png/v1/fill/w_856,h_481,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/6.png"],
        p:["To address these challenges, I recommend three Adobe solutions. Adobe Journey Optimizer can replace generic promos with personalized offers and real-time loyalty journeys, helping customers feel recognized and reducing the need for blanket discounts.","Adobe Experience Manager can centralize restaurant menus and photos, ensuring consistent, high-quality content across the app and website, which builds trust and improves conversion.","Creative Cloud tools like Photoshop and After Effects provide reusable templates and motion assets for campaigns, reducing bottlenecks and speeding up approvals."]
      },
      {
        h:"Journey Optimizer: Personalization at Scale",
        imgs:["https://static.wixstatic.com/media/9e26ae_a6de3627e5a947a2a8689f721b8d982f~mv2.png/v1/fill/w_856,h_481,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/7.png"],
        p:["DoorDash already personalizes parts of the customer experience, and their data science team has built strong models that recommend restaurants and items in the app. The challenge is that this system is very technical and mostly controlled by engineers, great for feed recommendations but less flexible for marketing teams who need to quickly test and adapt full journeys.","Adobe Journey Optimizer complements what DoorDash already has by putting these capabilities directly in the hands of marketers. It enables dynamic, behavior-triggered engagement across push, email, and in-app without relying on engineering sprints, and lets DoorDash design lifecycle messaging for DashPass so trial users convert into renewals."]
      },
      {
        h:"Creative Cloud: Campaigns at Scale",
        imgs:["https://static.wixstatic.com/media/9e26ae_8b1c3bfd273c415aa30c0f07cc0c9b64~mv2.png/v1/fill/w_854,h_480,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/8.png"],
        p:["DoorDash already presents partner menus and restaurant images consistently, but Creative Cloud adds the most value in branded promotions. With Photoshop, DoorDash can design reusable templates for in-app promos so every campaign feels professional and on-brand, saving creative teams time and giving partners a faster way to participate.","With After Effects, DoorDash can introduce light motion graphics to highlight limited-time deals or seasonal campaigns, making them stand out in the app carousel."]
      },
      {
        h:"Experience Manager: Consistent Content",
        imgs:["https://static.wixstatic.com/media/9e26ae_432ce3481dcb42cd9bbc0d47b033950d~mv2.png/v1/fill/w_856,h_481,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/9.png"],
        p:["As DoorDash expands into groceries, alcohol, and retail, managing thousands of partner assets becomes far more complex, since different merchants have different standards for photos, logos, and copy.","Adobe Experience Manager addresses this by serving as a centralized content hub, so every menu, photo, or promo tile looks clean, consistent, and on-brand. For partners, this means faster onboarding, and for DoorDash, a unified, professional experience across every category."]
      },
      {
        h:"The Customer Journey, End to End",
        imgs:["https://static.wixstatic.com/media/9e26ae_8783410c6280459f918dc0cdb8712a4a~mv2.png/v1/fill/w_856,h_481,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/10.png","https://static.wixstatic.com/media/9e26ae_088900e21a53488fbbc19a1844f030d6~mv2.png/v1/fill/w_856,h_481,al_c,q_90,usm_0.66_1.00_0.01,enc_avif,quality_auto/11.png"],
        p:["At awareness, Journey Optimizer sends hyper-personalized push notifications reflecting a user's favorite cuisines. At consideration, Experience Manager ensures partner promotions are presented consistently. At purchase, Creative Cloud templates drive polished in-app upsells. Post-purchase, Journey Optimizer enables re-engagement offers, and loyalty is strengthened through targeted DashPass promotions."]
      },
      {
        h:"Transforming the DoorDash Experience",
        imgs:[],
        p:["Together, these solutions drive measurable impact: more personalized customer journeys, faster campaign execution, and stronger loyalty. In short, Adobe doesn't just solve today's challenges for DoorDash, it sets them up for long-term growth."]
      }
    ]
  },
  {
    slug:"lumnus",
    label:"Consulting",
    title:"Lumnus Consulting",
    tagLine:"Standardization & Strategy",
    hoverDesc:"An internal consulting project on marketing, mentorship pairing, and fair recruitment scoring.",
    theme:{a:"var(--sky)", b:"var(--mint)", aDeep:"var(--sky-deep)", bDeep:"var(--mint-deep)"},
    tint:"#8fcbff",
    cover:"https://static.wixstatic.com/media/9e26ae_357ebb5f47d648058f70b478ad6d5819~mv2.jpeg/v1/fill/w_280,h_274,al_c,lg_1,q_80,enc_avif,quality_auto/1631334371066.jpeg",
    subhead:"Standardizing marketing, mentorship, and recruitment for Lumnus Consulting",
    intro:"The Fall 2023 ITP Internal Project focused on enhancing Lumnus Consulting's marketing, consultant-associate pairing, and recruitment processes. Our marketing team conducted primary research using Google Forms and Instagram analytics to identify engagement gaps and developed a new design package with improved post templates, a structured posting timeline, and content strategies to boost outreach.",
    intro2:"The consultant-associate pairing program was refined with personalized slides and more structured interactions, and the recruitment process was streamlined with a standardized scoring system to improve fairness and efficiency.",
    figmaLink:"https://docs.google.com/document/d/1d7BRxdOImGi-rF7Bxp_8HYntfp1GmSm7Ze934X_2gUw/edit?usp=sharing",
    figmaLabel:"Read the full deliverable",
    sections:[
      {
        h:"Research",
        imgs:["https://static.wixstatic.com/media/9e26ae_c0a27a61fb854cadafb7e737ed7000b1~mv2.jpg/v1/fill/w_600,h_431,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/9e26ae_c0a27a61fb854cadafb7e737ed7000b1~mv2.jpg","https://static.wixstatic.com/media/9e26ae_8b78b898e11748c88953186249a76220~mv2.png/v1/fill/w_600,h_431,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/9e26ae_8b78b898e11748c88953186249a76220~mv2.png"],
        p:["Our research combined quantitative and qualitative approaches to analyze Lumnus's social media performance and the consultant-associate program. We collected Instagram analytics to assess engagement trends and reach, while a Google Form survey gathered member insights on the platform and areas for improvement.","To examine the pairing process, we surveyed current interns about their experiences and interviewed members of the Human Resources Committee for behind-the-scenes insight - together forming a comprehensive picture that guided our recommendations."]
      },
      {
        h:"Social Media Marketing",
        imgs:[],
        p:["To improve engagement, Lumnus is revamping its Instagram stories and posts with a more structured, visually appealing approach - using stories more frequently to showcase both the professional and community sides of Lumnus, with vibrant colors and engaging fonts. New highlight templates, including \"A Day in the Life,\" \"Takeovers,\" and \"Tips Tuesday,\" create consistency and boost interaction.","For posts, updated templates for recruitment announcements, consultant spotlights, and event promotions ensure clarity and engagement, helping Lumnus boost outreach, maintain brand consistency, and improve audience retention."]
      },
      {
        h:"Standardization System",
        imgs:["https://static.wixstatic.com/media/9e26ae_0eee73117c0740d09f9aaf87ac5f179c~mv2.jpg/v1/fill/w_600,h_552,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/9e26ae_0eee73117c0740d09f9aaf87ac5f179c~mv2.jpg"],
        p:["The standardization system ensures fairness in recruitment by adjusting candidate scores to account for variations in judging style. Since different proctors may rate candidates inconsistently, a mathematical formula normalizes scores using each judge's average and standard deviation, allowing fair comparison across all candidates.","Final standardized scores are averaged and visualized in a graph to streamline deliberations, making it easier to identify strong candidates. While this system enhances objectivity, challenges include implementation complexity and the need for further data to refine its effectiveness."]
      }
    ]
  },

const frameTypeMap = {
  "instagram":"raw",
  "adobe-doordash":"browser",
  "lumnus":"browser",
  "vpm":"pin",
  "sullivan":"pin",
  "microwave":"product"
};

const rotations = [-4, 3, -2, 5, -5, 2, -3, 4];

function mosaicHTML(imgs, title, slug){
  if(!imgs || imgs.length===0) return '';
  const type = frameTypeMap[slug] || 'gallery';

  if(type === 'raw'){
    const items = imgs.map((src,i) => `
      <div class="raw-item" style="margin-top:${i%2===0?'0':'26px'};">
        <img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')">
      </div>`).join('');
    return `<div class="mosaic">${items}</div>`;
  }

  if(type === 'phone'){
    const items = imgs.map((src,i) => `
      <div class="frame-phone" style="transform:rotate(${rotations[i%rotations.length]}deg); margin-top:${i%2===0?'0':'26px'};">
        <div class="screen"><img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')"></div>
      </div>`).join('');
    return `<div class="mosaic">${items}</div>`;
  }

  if(type === 'browser'){
    const items = imgs.map((src,i) => `
      <div class="frame-browser" style="transform:rotate(${rotations[i%rotations.length]*0.6}deg); margin-top:${i%2===0?'10px':'0'};">
        <div class="bar"><span style="background:var(--accent-a-deep)"></span><span style="background:var(--accent-b-deep)"></span><span style="background:var(--ink-faint)"></span></div>
        <img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')">
      </div>`).join('');
    return `<div class="mosaic">${items}</div>`;
  }

  if(type === 'pin'){
    const items = imgs.map((src,i) => `
      <div class="frame-pin" style="transform:rotate(${rotations[i%rotations.length]}deg);">
        <img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')">
      </div>`).join('');
    return `<div class="pin-mosaic">${items}</div>`;
  }

  if(type === 'product'){
    const items = imgs.map(src => `<div class="frame-product"><img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')"></div>`).join('');
    return items;
  }

  const cls = imgs.length===1 ? 'single' : imgs.length>=3 ? 'three' : '';
  const items = imgs.map(src => `<img src="${src}" alt="${title}" loading="lazy" onclick="openLightbox('${src}')">`).join('');
  return `<div class="gallery ${cls}">${items}</div>`;
}

/* ============ RENDER + ROUTE ============ */
function render(){
  const hash = location.hash || '#/';
  document.documentElement.style.setProperty('--accent-a', 'var(--pink)');
  document.documentElement.style.setProperty('--accent-b', 'var(--lav)');
  document.documentElement.style.setProperty('--accent-a-deep', 'var(--pink-deep)');
  document.documentElement.style.setProperty('--accent-b-deep', 'var(--lav-deep)');
  document.documentElement.style.setProperty('--accent-pale', '#fff3fa');

  let bodyHTML = '';
  let activeSlug = null;

  if(hash === '#/' || hash === ''){
    bodyHTML = homeHTML();
  } else if(hash === '#/about'){
    bodyHTML = aboutHTML();
  } else if(hash.startsWith('#/project/')){
    const slug = hash.replace('#/project/','');
    activeSlug = slug;
    bodyHTML = projectHTML(slug);
  } else {
    bodyHTML = homeHTML();
  }

  app.innerHTML = topbarHTML(activeSlug) + bodyHTML;
  window.scrollTo({top:0, behavior:'instant'});
  initReveal();
  initGrids();
}

function initReveal(){
  const els = document.querySelectorAll('.reveal');
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('in'); obs.unobserve(e.target); }
    });
  }, {threshold:0.12});
  els.forEach(el=>obs.observe(el));
}

/* ---- interactive hover grid background ---- */
const gridColors = ['var(--pink)','var(--lav)','var(--mint)','var(--peach)','var(--sky)','var(--butter)'];
const gridCellSize = 34;

function buildGrid(container){
  container.innerHTML = '';
  const wrap = container.parentElement;
  const w = wrap.clientWidth || window.innerWidth;
  const h = wrap.clientHeight || window.innerHeight;
  const cols = Math.ceil((w * 2.4) / gridCellSize);
  const rows = Math.ceil((h * 2.4) / gridCellSize);

  const frag = document.createDocumentFragment();
  for(let c=0;c<cols;c++){
    const col = document.createElement('div');
    col.className = 'grid-row';
    for(let r=0;r<rows;r++){
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      cell.addEventListener('mouseenter', ()=>{
        cell.style.transition = 'background-color 0s';
        cell.style.backgroundColor = gridColors[Math.floor(Math.random()*gridColors.length)];
        setTimeout(()=>{ cell.style.transition='background-color .6s ease'; cell.style.backgroundColor='transparent'; }, 120);
      });
      col.appendChild(cell);
    }
    frag.appendChild(col);
  }
  container.appendChild(frag);
}

function initGrids(){
  document.querySelectorAll('[data-grid]').forEach(buildGrid);
}

let gridResizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(gridResizeTimer);
  gridResizeTimer = setTimeout(initGrids, 250);
});

function openLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}
document.getElementById('lightbox').addEventListener('click', (e)=>{
  if(e.target.id === 'lightbox') closeLightbox();
});

window.addEventListener('hashchange', render);
render();
</script>
